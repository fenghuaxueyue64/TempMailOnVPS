# nginx/conf.d/tempmail.conf — 由 /etc/nginx/nginx.conf 的 http{} include
# ★ 部署前全局替换域名：tmp.io → 你的域名（共 5 处）

# ---- 以下指令必须在 http 上下文（不能放进 server{}）----

# WebSocket 升级头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API 限速（30 req/s，突发 60）
limit_req_zone $binary_remote_addr zone=tempmail_api:10m rate=30r/s;

# ---- HTTP → HTTPS 重定向（同时服务 certbot webroot 续期） ----
server {
    listen       80;
    server_name  tmp.io mail.tmp.io;   # ← 替换为你的域名

    # Certbot webroot 续期验证（compose 已挂载共享目录）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen       443 ssl;
    http2        on;
    server_name  tmp.io;   # ← 替换为你的域名

    ssl_certificate      /etc/letsencrypt/live/tmp.io/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/tmp.io/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # ① WebSocket 实时推送 —— 注意：不带尾斜杠！前端请求路径是 /ws?token=…
    location /ws {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;       # WebSocket 长连接，不能超时
        proxy_send_timeout 3600s;
    }

    # ② SSE 实时推送 —— 同样不带尾斜杠
    location /sse {
        proxy_pass             http://app:3000;
        proxy_buffering        off;     # SSE 必须关闭缓冲，否则事件无法实时到达
        proxy_cache            off;
        proxy_set_header       Connection '';
        proxy_http_version     1.1;
        proxy_read_timeout     3600s;
        chunked_transfer_encoding on;
    }

    # ③ 健康检查（无鉴权，不限速，不记日志）
    location = /api/health {
        proxy_pass      http://app:3000;
        access_log      off;
    }

    # ④ API 路由（带限速）
    location /api/ {
        limit_req       zone=tempmail_api burst=60 nodelay;
        proxy_pass      http://app:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ⑤ 其余：Web UI（由 Bun 后端托管 SvelteKit 静态产物 + SPA fallback）
    location / {
        proxy_pass       http://app:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
